name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name Calcularte --paths calcularte --collect-all sv_ttk calcularte/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: Calcularte-exe
          path: dist/Calcularte.exe
